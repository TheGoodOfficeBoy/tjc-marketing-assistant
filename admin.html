<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TJC ทีมประมูล | Admin</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo">TJC</div>
      <div>
        <div class="title">Admin Panel</div>
        <div class="subtitle">จัดการสิทธิ์ผู้ใช้</div>
      </div>
    </div>

    <div class="actions">
      <a class="btn ghost" href="app.html">กลับหน้าเมนู</a>
      <button class="btn danger" id="btnLogout">Logout</button>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h1 class="h1">จัดการสิทธิ์</h1>
      <p class="muted">ค้นหาโดย Email แล้วตั้ง role เป็น <b>user</b> หรือ <b>admin</b></p>

      <div class="grid">
        <div class="field">
          <label>Email ผู้ใช้</label>
          <input id="targetEmail" type="email" placeholder="user@company.com" />
        </div>
        <div class="field">
          <label>Role</label>
          <select id="targetRole">
            <option value="user">user</option>
            <option value="admin">admin</option>
          </select>
        </div>
      </div>

      <button class="btn primary" id="btnSetRole">บันทึกสิทธิ์</button>

      <p class="note" id="msg"></p>
    </section>

    <section class="card soft">
      <h2 class="h2">รายการผู้ใช้ล่าสุด</h2>
      <div id="users" class="table"></div>
    </section>
  </main>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
