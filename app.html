<!-- YouTube Music Player -->
<div id="youtube-player-container" style="text-align: center; margin-top: 20px;">
  <!-- ปรับขนาดให้รองรับทุกอุปกรณ์ (responsive) -->
  <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; width: 100%; background: #000;">
    <iframe id="youtube-player" 
            width="100%" 
            height="100%" 
            src="https://www.youtube.com/embed/?enablejsapi=1" 
            frameborder="0" 
            allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen 
            style="position: absolute; top: 0; left: 0;">
    </iframe>
  </div>

  <!-- กล่องค้นหาพร้อมปุ่ม -->
  <input type="text" id="youtube-search" placeholder="ค้นหาเพลง..." style="margin-top: 10px; padding: 10px; width: 100%; max-width: 500px;" />
  <button id="search-btn" style="padding: 10px 20px; background-color: #4CAF50; color: white; border: none; cursor: pointer; margin-top: 10px;">ค้นหา</button>

  <!-- ปุ่มควบคุมการเล่น -->
  <div style="margin-top: 20px;">
    <button onclick="pauseVideo()" style="padding: 10px 20px; background-color: #FF9800; color: white; border: none; cursor: pointer;">หยุดชั่วคราว</button>
    <button onclick="playVideo()" style="padding: 10px 20px; background-color: #2196F3; color: white; border: none; cursor: pointer;">เล่น</button>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  var player;

  // ฟังก์ชันที่จะทำให้ YouTube Player ทำงาน
  function onYouTubeIframeAPIReady() {
    player = new YT.Player('youtube-player', {
      events: {
        'onReady': onPlayerReady,
        'onStateChange': onPlayerStateChange
      }
    });
  }

  // เริ่มการเล่นเมื่อ API พร้อม
  function onPlayerReady(event) {
    event.target.playVideo();
  }

  // ฟังก์ชันการควบคุมการเล่น
  function playVideo() {
    player.playVideo();
  }

  function pauseVideo() {
    player.pauseVideo();
  }

  function stopVideo() {
    player.stopVideo();
  }

  // ฟังก์ชันค้นหาเพลงจาก YouTube
  document.getElementById('search-btn').addEventListener('click', function() {
    var searchTerm = document.getElementById('youtube-search').value;
    searchYouTube(searchTerm);
  });

  function searchYouTube(query) {
    var apiKey = 'YOUR_YOUTUBE_API_KEY';  // ใส่ API Key ของคุณที่นี่
    var url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${query}&key=${apiKey}`;
    fetch(url)
      .then(response => response.json())
      .then(data => {
        if (data.items.length > 0) {
          var videoId = data.items[0].id.videoId;
          loadVideo(videoId);
        }
      })
      .catch(error => console.log('เกิดข้อผิดพลาดในการดึงข้อมูล: ', error));
  }

  function loadVideo(videoId) {
    var player = document.getElementById('youtube-player');
    player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&enablejsapi=1`;
  }
</script>
                      <!-- END YouTube Music Player Process-->
  <script>
    (function () {
      const root = document.documentElement;
      const themeToggle = document.getElementById("themeToggle");
      const themeLabel = document.getElementById("themeLabel");
      const themeIcon = document.getElementById("themeIcon");

      const saved = localStorage.getItem("theme");
      const systemDark = window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches;

      const initialTheme = saved || (systemDark ? "dark" : "light");

      function moonSvg() {
        return `
          <svg viewBox="0 0 24 24">
            <path d="M21 12.6A8.5 8.5 0 0 1 11.4 3a7 7 0 1 0 9.6 9.6Z"/>
          </svg>
        `;
      }

      function sunSvg() {
        return `
          <svg viewBox="0 0 24 24">
            <path d="M12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12Zm0-16h0.01M12 22h0.01M4.22 4.22h0.01M19.78 19.78h0.01M2 12h0.01M22 12h0.01M4.22 19.78h0.01M19.78 4.22h0.01"/>
          </svg>
        `;
      }

      function applyTheme(theme) {
        root.setAttribute("data-theme", theme);
        localStorage.setItem("theme", theme);

        if (themeLabel) {
          themeLabel.textContent = theme === "dark" ? "Light" : "Dark";
        }

        if (themeIcon) {
          themeIcon.innerHTML = theme === "dark" ? sunSvg() : moonSvg();
        }
      }

      applyTheme(initialTheme);

      themeToggle?.addEventListener("click", () => {
        const current = root.getAttribute("data-theme") || "light";
        applyTheme(current === "dark" ? "light" : "dark");
      });
    })();
  </script>
</body>
</html>
