<style>
/* ===== TJC FIGHTER GAME ===== */
#tjcf-section{
  display:flex;flex-direction:column;align-items:center;
  gap:14px;margin:28px auto 40px;width:620px;max-width:100%;box-sizing:border-box;
}
#tjcf-title{
  font-family:'Press Start 2P',monospace;font-size:1.5rem;letter-spacing:4px;text-align:center;
  background:linear-gradient(90deg,#ff3c3c,#ff9900,#ffe600,#39ff14,#00d4ff,#ff6ec7,#ff3c3c);
  background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:titleScroll 3s linear infinite;
  filter:drop-shadow(0 0 14px rgba(255,153,0,0.5));
}
@keyframes titleScroll{0%{background-position:0%}100%{background-position:300%}}

#tjcf-wrap{
  width:620px;max-width:100%;background:#080810;
  border:3px solid #ff9900;border-radius:6px;
  box-shadow:0 0 0 1px #000,0 0 50px rgba(255,153,0,0.25),inset 0 0 40px rgba(0,0,0,0.6);
  overflow:hidden;box-sizing:border-box;position:relative;
}
#tjcf-hud{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;background:#0d0d1a;border-bottom:2px solid #ff9900;gap:8px;flex-wrap:wrap;
}
.tjcf-hud-stat{
  font-family:'Press Start 2P',monospace;font-size:0.5rem;
  color:#ff9900;display:flex;flex-direction:column;gap:2px;
}
.tjcf-hud-label{color:rgba(255,255,255,0.3);font-size:0.42rem;}
.tjcf-hud-val{color:#ffe600;}
#tjcf-hp-wrap,#tjcf-mp-wrap{display:flex;align-items:center;gap:6px;}
#tjcf-hp-wrap .tjcf-hud-label,#tjcf-mp-wrap .tjcf-hud-label{font-family:'Press Start 2P',monospace;font-size:0.42rem;color:rgba(255,255,255,0.3);}
.tjcf-bar-bg{width:90px;height:8px;background:#1a0a0a;border:1px solid #333;border-radius:2px;overflow:hidden;}
.tjcf-bar-fill{height:100%;border-radius:2px;transition:width 0.15s;}
#tjcf-hp-fill{background:linear-gradient(90deg,#ff3c3c,#ff6b35);}
#tjcf-mp-fill{background:linear-gradient(90deg,#00d4ff,#7a2be2);}
#tjcf-hud-btns{display:flex;gap:6px;}
.tjcf-hud-btn{
  background:#1a1a2a;border:1px solid #444;border-radius:3px;
  color:#aaa;font-family:'Press Start 2P',monospace;font-size:0.45rem;
  padding:5px 8px;cursor:pointer;transition:all 0.15s;
}
.tjcf-hud-btn:hover{border-color:#ff9900;color:#ff9900;}

#tjcf-canvas-wrap{position:relative;width:100%;height:280px;overflow:hidden;background:#05050f;}
#tjcfCanvas{display:block;width:100%;height:280px;touch-action:none;}
#tjcf-scanlines{
  position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);
}

/* CONTROLS (D-PAD & SKILLS) */
#tjcf-controls{
  display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;
  gap:6px;padding:10px 14px;background:#0d0d1a;border-top:1px solid rgba(255,153,0,0.2);
}
#tjcf-dpad{display:flex;align-items:center;gap:4px;}
.tjcf-btn-dir-col{display:flex;flex-direction:column;gap:4px;}
.tjcf-btn-dir{
  width:40px;height:40px;background:#1a1a2a;border:2px solid #333;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  color:#aaa;font-size:1.1rem;cursor:pointer;user-select:none;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,0.4);transition:all 0.1s;
  touch-action: none; /* ห้ามหน้าจอเลื่อนเวลาแตะเดิน */
}
.tjcf-btn-dir.pressed{
  background:#333;border-color:#ff9900;color:#ff9900;
  box-shadow:inset 0 3px 0 rgba(0,0,0,0.6);
}
#tjcf-action-btns{display:flex;align-items:center;gap:5px;}
.tjcf-skill-slot{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-family:'Press Start 2P',monospace;font-size:0.35rem;
}
.tjcf-skill-icon{
  width:38px;height:38px;border-radius:6px;border:2px solid #333;
  display:flex;align-items:center;justify-content:center;font-size:1rem;
