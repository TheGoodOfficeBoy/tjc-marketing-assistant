<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TJC ทีมประมูล | Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="bg"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo">TJC</div>
      <div>
        <div class="title">TJC ทีมประมูล</div>
        <div class="subtitle">Portal สำหรับลิงก์ใช้งาน</div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h1 class="h1">เข้าสู่ระบบ</h1>
      <p class="muted">ใช้ Username + Password</p>

      <div class="grid">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" type="text" placeholder="เช่น tjc01" autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
      </div>

      <button class="btn primary" id="btnLogin" type="button">Login</button>

      <div class="divider"><span>หรือ</span></div>

      <h2 class="h2">สมัครสมาชิก</h2>
      <p class="muted">สมัครแล้วระบบจะให้สิทธิ์เป็น “user” อัตโนมัติ</p>
      <button class="btn" id="btnRegister" type="button">Register</button>

      <p class="note" id="msg"></p>
    </section>
  </main>

  <script type="module" src="./firebase.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
